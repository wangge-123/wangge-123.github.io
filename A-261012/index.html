: null, "tex": null}];
const CABS = [{"name": "左开门地柜", "room": "", "w": 450.0, "h": 690.0, "d": 550.0, "qty": 1}, {"name": "右开门地柜", "room": "", "w": 450.0, "h": 690.0, "d": 550.0, "qty": 1}, {"name": "右开门地柜", "room": "", "w": 450.0, "h": 690.0, "d": 550.0, "qty": 1}];

// 柜体
(function(){
  const c=document.getElementById('cabs');
  CABS.forEach(x=>{const d=document.createElement('div');d.className='cab';
    d.innerHTML='<b>'+x.name+'</b>'+(x.room?' · '+x.room:'')+(x.w&&x.h?(' · '+x.w+'×'+x.h):'')+(x.qty>1?(' ×'+x.qty):'');
    c.appendChild(d);});
})();

// 生成每块板
const wrap=document.getElementById('panels');
PANELS.forEach((p,idx)=>{
  const card=document.createElement('div');card.className='panel';
  card.innerHTML='<div class="panel-h"><div class="nm"><span class="gno">组'+p.group+'</span> '+p.part+' · '+p.barcode+'</div>'+
    '<div class="rm">'+(p.room?p.room+' · ':'')+(p.material||p.color||'')+(p.texture?' · '+p.texture:'')+'</div></div>'+
    '<div class="panel-grid">'+
      '<div class="panel-left"><div class="dim">'+(p.img?('<img src="'+p.img+'" alt="尺寸图">'):'<div class="empty">宏光未生成尺寸图</div>')+'</div></div>'+
      '<div class="panel-right"><div class="annot"><canvas data-i="'+idx+'"></canvas><div class="css2d" data-css="'+idx+'"></div></div></div>'+
    '</div>'+
    '<div class="annot-bar" data-bar="'+idx+'">'+
      '<span class="lbl">标注:</span>'+
      '<button class="mode-btn on" data-mode="out">外形标准</button>'+
      '<button class="mode-btn" data-mode="in">内空标注</button>'+
      '<button class="mode-btn" data-mode="all">全部标注</button>'+
      '<span class="font-row"><span class="fz">字</span><input type="range" min="12" max="30" value="15" data-fz="'+idx+'"></span>'+
    '</div>'+
    '<div class="spec">'+
      '<div class="cell"><div class="k">成品尺寸 宽×高×厚</div><div class="v">'+p.w+' × '+p.h+' × '+p.d+' <small>mm</small></div></div>'+
      '<div class="cell"><div class="k">数量</div><div class="v">'+p.qty+'</div></div>'+
      '<div class="cell"><div class="k">基材</div><div class="v">'+p.base+'</div></div>'+
      '<div class="cell"><div class="k">材质 / 纹理</div><div class="v">'+(p.color||'—')+(p.texture?' / '+p.texture:'')+'</div></div>'+
      (p.edge?'<div class="cell"><div class="k">封边</div><div class="v">'+p.edge+'</div></div>':'')+
    '</div>';
  wrap.appendChild(card);
  init3D(p, card.querySelector('canvas'), idx);
});

function init3D(p, canvas, idx){
  const w=p.w,h=p.h,d=p.d;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  const scene=new THREE.Scene();scene.background=new THREE.Color(0xffffff);
  scene.add(new THREE.HemisphereLight(0xffffff,0xe8e8e8,1.0));
  const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(900,1400,1100);scene.add(key);
  const rim=new THREE.DirectionalLight(0xffffff,0.4);rim.position.set(-700,-200,-900);scene.add(rim);

  let aspect=canvas.clientWidth/Math.max(1,canvas.clientHeight);
  const fov=38, dist=Math.max(w,h,d)*2.6;
  const cam=new THREE.PerspectiveCamera(fov,aspect,1,dist*20);
  const geo=new THREE.BoxGeometry(w,h,d);
  const mat=(p.tex)?new THREE.MeshStandardMaterial({map:(()=>{const t=new THREE.TextureLoader().load(p.tex);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(0.6,Math.max(1,h/w*0.8));t.anisotropy=6;return t;})()
    , roughness:0.7, metalness:0})
    :new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.6,metalness:0});
  const mesh=new THREE.Mesh(geo,[mat,mat,mat,mat,mat,mat]);
  scene.add(mesh);

  // 外形标注线（宽、高、厚）
  function dimLine(a,b,offset){const dir=b.clone().sub(a).normalize();
    const oa=a.clone().add(dir.clone().multiplyScalar(offset)),ob=b.clone().add(dir.clone().multiplyScalar(offset));
    const geo2=new THREE.BufferGeometry().setFromPoints([oa,ob]);
    const g=new THREE.Line(geo2,new THREE.LineBasicMaterial({color:0x1a4fc9}));scene.add(g);
    const e=dist*0.03, nd=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,0,1)).normalize();
    const mk=(p0)=>{const sg=new THREE.BufferGeometry().setFromPoints([p0.clone().add(nd.clone().multiplyScalar(e)),p0.clone().add(nd.clone().multiplyScalar(-e))]);scene.add(new THREE.Line(sg,new THREE.LineBasicMaterial({color:0x1a4fc9})));};
    mk(oa);mk(ob);return [(oa.clone().add(ob)).multiplyScalar(0.5),dir];}
  const hl=h, wl=w, dl=d;
  const hLine=dimLine(new THREE.Vector3(0,-hl/2,0),new THREE.Vector3(0,hl/2,0),wl/2+Math.max(20,d));
  const wLine=dimLine(new THREE.Vector3(-wl/2,0,0),new THREE.Vector3(wl/2,0,0),-hl/2-Math.max(20,d));
  const dLine=dimLine(new THREE.Vector3(0,0,-dl/2),new THREE.Vector3(0,0,dl/2),wl/2+Math.max(20,d));

  // CSS2D 标注层
  const cssLayer=document.querySelector('[data-css="'+idx+'"]');
  let mode='out',fontSize=15;
  function mkLabel(text,pos,id){let s=document.getElementById('lb'+id);if(!s){s=document.createElement('span');s.id='lb'+id;cssLayer.appendChild(s);}s.textContent=text;s.style.fontSize=fontSize+'px';s.style.color='#1a4fc9';const v=pos.clone().project(cam);s.style.left=((v.x*0.5+0.5)*100)+'%';s.style.top=((-v.y*0.5+0.5)*100)+'%';}
  function applyAnnot(){
    // 清除所有标签
    cssLayer.querySelectorAll('span').forEach(s=>s.remove());
    if(mode==='out'||mode==='all'){
      mkLabel(Math.round(wl)+'mm',wLine[0].clone().add(new THREE.Vector3(0,-Math.max(20,d)-18,0)),'w');
      mkLabel(Math.round(hl)+'mm',hLine[0].clone().add(new THREE.Vector3(wl/2+Math.max(20,d)+16,0,0)),'h');
      mkLabel(Math.round(dl)+'mm',dLine[0].clone().add(new THREE.Vector3(wl/2+Math.max(20,d)+16,0,0)),'d');
    }
    if(mode==='in'){mkLabel('内空: 无 (平板)',new THREE.Vector3(0,0,d),'in');}
  }

  // 标注控制
  const bar=document.querySelector('[data-bar="'+idx+'"]');
  if(bar){
    bar.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{
      bar.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');mode=b.getAttribute('data-mode');applyAnnot();}));
    bar.querySelector('[data-fz="'+idx+'"]').addEventListener('input',e=>{fontSize=+e.target.value;applyAnnot();});
  }

  let th=0.6,ph=1.0,cd=dist;
  function camApply(){const sp=Math.sin(ph);cam.position.set(cd*sp*Math.sin(th),cd*Math.cos(ph),cd*sp*Math.cos(th));cam.lookAt(0,0,0);}
  function resize(){const cw=canvas.clientWidth||canvas.parentElement.clientWidth,ch=canvas.clientHeight||canvas.parentElement.clientHeight;
    if(!cw||!ch)return;renderer.setSize(cw,ch,false);cam.aspect=cw/ch;cam.updateProjectionMatrix();}
  new ResizeObserver(resize).observe(canvas.parentElement);resize();
  let dragging=false,px=0,py=0,idle=true,timer=null;
  function down(e){dragging=true;px=(e.touches?e.touches[0].clientX:e.clientX);py=(e.touches?e.touches[0].clientY:e.clientY);canvas.style.cursor='grabbing';idle=false;clearTimeout(timer);applyAnnot();}
  function move(e){if(!dragging)return;const x=(e.touches?e.touches[0].clientX:e.clientX),y=(e.touches?e.touches[0].clientY:e.clientY);
    th-=(x-px)*0.006;ph=Math.max(0.15,Math.min(2.9,ph-(y-py)*0.005));px=x;py=y;camApply();applyAnnot();}
  function up(){dragging=false;canvas.style.cursor='grab';timer=setTimeout(()=>idle=true,1000);}
  function wheel(e){e.preventDefault();cd=Math.max(dist*0.3,Math.min(dist*3,cd*(e.deltaY>0?1.12:0.89)));camApply();applyAnnot();}
  canvas.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
  canvas.addEventListener('wheel',wheel,{passive:false});
  canvas.addEventListener('touchstart',down,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',up);canvas.addEventListener('touchcancel',up);
  camApply();
  (function loop(){requestAnimationFrame(loop);renderer.render(scene,cam);})();
  applyAnnot();
}
