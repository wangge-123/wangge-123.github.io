  card.innerHTML='<div class="panel-h"><div class="nm">'+p.part+' · '+p.barcode+'</div>'+
    '<div class="rm">'+(p.room?p.room+' · ':'')+(p.material||p.color||'')+(p.texture?' · '+p.texture:'')+'</div></div>'+
    '<div class="panel-grid">'+
      '<div class="panel-left"><div class="dim">'+(p.img?('<img src="'+p.img+'" alt="尺寸图">'):'<div class="empty">宏光未生成尺寸图</div>')+'</div></div>'+
      '<div class="panel-right"><canvas data-i="'+idx+'"></canvas></div>'+
    '</div>'+
    '<div class="spec">'+
      '<div class="cell"><div class="k">成品尺寸 宽×高×厚</div><div class="v">'+p.w+' × '+p.h+' × '+p.d+' <small>mm</small></div></div>'+
      '<div class="cell"><div class="k">数量</div><div class="v">'+p.qty+'</div></div>'+
      '<div class="cell"><div class="k">基材</div><div class="v">'+p.base+'</div></div>'+
      '<div class="cell"><div class="k">材质 / 纹理</div><div class="v">'+(p.color||'—')+(p.texture?' / '+p.texture:'')+'</div></div>'+
      (p.edge?'<div class="cell"><div class="k">封边</div><div class="v">'+p.edge+'</div></div>':'')+
    '</div>';
  wrap.appendChild(card);
  init3D(p, card.querySelector('canvas'), idx);
});

function init3D(p, canvas, idx){
  const w=p.w,h=p.h,d=p.d;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  const scene=new THREE.Scene();scene.background=new THREE.Color(0xfdfbf6);
  scene.add(new THREE.HemisphereLight(0xfff6e8,0xd8cfc0,0.8));
  const key=new THREE.DirectionalLight(0xfff2df,1.5);key.position.set(900,1400,1100);scene.add(key);
  const rim=new THREE.DirectionalLight(0xffffff,0.5);rim.position.set(-700,-200,-900);scene.add(rim);

  let aspect=canvas.clientWidth/Math.max(1,canvas.clientHeight);
  const fov=38, dist=Math.max(w,h,d)*2.6;
  const cam=new THREE.PerspectiveCamera(fov,aspect,1,dist*20);
  const geo=new THREE.BoxGeometry(w,h,d);
  const mat=(p.tex)?new THREE.MeshStandardMaterial({map:(()=>{const t=new THREE.TextureLoader().load(p.tex);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(0.6,Math.max(1,h/w*0.8));t.anisotropy=6;return t;})()
    , roughness:0.7, metalness:0})
    :new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(((idx*0.13)%1),0.25,0.62),roughness:0.7,metalness:0});
  const mesh=new THREE.Mesh(geo,[mat,mat,mat,mat,mat,mat]);
  scene.add(mesh);

  // 尺寸参考线
  const dp=[new THREE.Vector3(0,-h/2,d/2+Math.max(20,d*0.1)),new THREE.Vector3(0,h/2,d/2+Math.max(20,d*0.1))];
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(dp),new THREE.LineBasicMaterial({color:0xb5895b})));

  let th=0.6,ph=1.0,cd=dist;
  function camApply(){const sp=Math.sin(ph);cam.position.set(cd*sp*Math.sin(th),cd*Math.cos(ph),cd*sp*Math.cos(th));cam.lookAt(0,0,0);}
  function resize(){const cw=canvas.clientWidth||canvas.parentElement.clientWidth,ch=canvas.clientHeight||canvas.parentElement.clientHeight;
    if(!cw||!ch)return;renderer.setSize(cw,ch,false);cam.aspect=cw/ch;cam.updateProjectionMatrix();}
  new ResizeObserver(resize).observe(canvas.parentElement);resize();
  let dragging=false,px=0,py=0,idle=true,timer=null;
  function down(e){dragging=true;px=(e.touches?e.touches[0].clientX:e.clientX);py=(e.touches?e.touches[0].clientY:e.clientY);canvas.style.cursor='grabbing';idle=false;clearTimeout(timer);}
  function move(e){if(!dragging)return;const x=(e.touches?e.touches[0].clientX:e.clientX),y=(e.touches?e.touches[0].clientY:e.clientY);
    th-=(x-px)*0.006;ph=Math.max(0.15,Math.min(2.9,ph-(y-py)*0.005));px=x;py=y;camApply();}
  function up(){dragging=false;canvas.style.cursor='grab';timer=setTimeout(()=>idle=true,3000);}
  function wheel(e){e.preventDefault();cd=Math.max(dist*0.3,Math.min(dist*3,cd*(e.deltaY>0?1.12:0.89)));camApply();}
  canvas.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
  canvas.addEventListener('wheel',wheel,{passive:false});
  canvas.addEventListener('touchstart',down,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',up);canvas.addEventListener('touchcancel',up);
  camApply();
  (function loop(){requestAnimationFrame(loop);if(idle){th+=0.004;camApply();}renderer.render(scene,cam);})();
}
</script>
</body>
</html>
