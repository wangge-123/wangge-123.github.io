<style>
:root{--bg:#eef1f4;--panel:#ffffff;--panel2:#f3f5f7;--line:#d3d9df;--accent:#d97a1f;--text:#24282e;--dim:#7a828c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#viewport{position:fixed;inset:0}
#head{position:fixed;top:14px;left:16px;z-index:5;pointer-events:none;max-width:70vw}
#head h1{font-size:15px;font-weight:700;letter-spacing:.5px}
#head h1 i{color:var(--accent);font-style:normal}
#head p{font-size:11.5px;color:var(--dim);margin-top:2px}
#lang{position:fixed;top:14px;right:16px;z-index:6;display:flex;gap:4px}
#lang button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:11px;padding:4px 9px;border-radius:6px;cursor:pointer}
#lang button.on{color:var(--accent);border-color:var(--accent)}
#fn{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:6px}
#fn button{min-width:98px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:12px;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
#fn button:hover,#fn button.on{border-color:var(--accent);color:var(--accent)}
#viewbox{display:none;flex-direction:column;gap:4px;max-height:44vh;overflow:auto}
#viewbox.show{display:flex}
#viewbox .vh{color:var(--dim);font-size:10px;letter-spacing:1px;padding:2px 2px 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
#viewbox button{min-width:98px;background:var(--panel);border:1px dashed var(--line);color:var(--dim);font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;text-align:left}
#viewbox button:hover,#viewbox button.on{color:var(--accent);border-color:var(--accent)}
#annbox{display:none;flex-direction:column;gap:4px;max-height:30vh;overflow:auto}
#annbox.show{display:flex}
#annbox .vh{color:var(--dim);font-size:10px;letter-spacing:1px;padding:2px 2px 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
#annbox button{min-width:98px;background:var(--panel);border:1px dashed var(--line);color:var(--dim);font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;text-align:left}
#annbox button:hover,#annbox button.on{color:var(--accent);border-color:var(--accent)}
#fn button small{display:block;color:var(--dim);font-size:10px;margin-top:1px}
#info{position:fixed;left:16px;bottom:16px;z-index:6;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:236px;font-size:12px;line-height:1.9;backdrop-filter:blur(6px)}
#info .k{color:var(--dim)}
#info .v{color:var(--text);font-weight:600}
#bomMask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:center;justify-content:center}
#bomMask.show{display:flex}
#bom{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:560px;width:92vw;max-height:78vh;overflow:auto}
#bom h2{font-size:14px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
#bom table{width:100%;border-collapse:collapse;font-size:12px}
#bom th,#bom td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
#bom th{color:var(--dim);font-weight:600}
#bom tr:hover{background:var(--panel2)}
#bom .sum{color:var(--accent);font-weight:700}
#bom .close{float:right;cursor:pointer;color:var(--dim);font-size:16px;background:none;border:none}
.dim-label{color:#ffc98a;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
#meta{position:fixed;left:16px;top:76px;z-index:5;pointer-events:none;font-size:10.5px;color:var(--dim);max-width:70vw;line-height:1.7}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#ffffff;font-size:12px;font-weight:600;padding:8px 16px;border-radius:8px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:640px){
#head{top:10px;left:12px}#head h1{font-size:13px}
#lang{top:10px;right:12px}
#fn{right:10px;top:auto;bottom:14px;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:96vw}
#fn button{min-width:76px;font-size:11px;padding:6px 8px}
#viewbox{flex-direction:row;flex-wrap:wrap}
#viewbox .vh{flex-basis:100%}
#viewbox button{min-width:52px}
#annbox{flex-direction:row;flex-wrap:wrap}
#annbox .vh{flex-basis:100%}
#annbox button{min-width:52px}
#info{left:12px;right:12px;bottom:auto;top:12px;min-width:0;font-size:11px;line-height:1.7}
#meta{left:12px;top:86px}
}
</style>

scene.add(new THREE.DirectionalLight(0xdce9f5,0.7).translateX(-4));

addEventListener("resize",function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(ortho){var w2=(ortho.right-ortho.left)/2,h2=w2/(innerWidth/innerHeight);ortho.top=h2;ortho.bottom=-h2;ortho.updateProjectionMatrix();}renderer.setSize(innerWidth,innerHeight);lr.setSize(innerWidth,innerHeight);});
build();
toast("已生成安装图纸 · 点击板件查看信息");
(function loop(){requestAnimationFrame(loop);if(controls.enabled)controls.update();if(oc&&oc.enabled)oc.update();renderer.render(scene,curCam);lr.render(scene,curCam);})();
